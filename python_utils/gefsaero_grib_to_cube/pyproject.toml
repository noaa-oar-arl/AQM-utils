[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gefsaero-grib-to-cube"
version = "0.1.0"
description = "Tools for converting GEFS-Aerosol GRIB2 data to FV3 cubed-sphere format"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "UCAR"}
authors = [
    {name = "Cory R. Martin", email = "cory.r.martin@noaa.gov"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "grib2io>=1.1.0",
    "xarray>=2022.3.0",
]

[project.scripts]
ics_from_grib2 = "gefsaero_grib_to_cube.ics_from_grib2:main"

[tool.setuptools]
package-dir = {"gefsaero_grib_to_cube" = "."}
packages = ["gefsaero_grib_to_cube"]

[tool.pytest]
testpaths = ["tests"]
